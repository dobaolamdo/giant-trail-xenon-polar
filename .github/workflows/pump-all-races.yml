name: Pump OpenF1 → MySQL

# Manual: chọn năm. Schedule: chỉ 2026.
# /api/pump chậm (OpenF1 + hàng nghìn INSERT) → cần timeout dài, không phải service die.
on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year (historical one-shot; daily = 2026 only)"
        required: true
        default: "2026"
        type: choice
        options:
          - "2026"
          - "2025"
          - "2024"
          - "2023"
          - "all"
  schedule:
    - cron: "0 6 * * *"

jobs:
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Resolve session keys
        id: keys
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            YEAR="2026"
          else
            YEAR="${{ inputs.year }}"
          fi
          echo "mode=$YEAR event=${{ github.event_name }}"
          KEYS=""
          if [ "$YEAR" = "all" ] || [ "$YEAR" = "2023" ]; then
            KEYS="$KEYS 7953 7779 7787 9070 9078 9094 9102 9110 9118 9126 9133 9141 9149 9157 9165 9173 9221 9213 9181 9205 9189 9197"
          fi
          if [ "$YEAR" = "all" ] || [ "$YEAR" = "2024" ]; then
            KEYS="$KEYS 9472 9480 9488 9496 9673 9507 9515 9523 9531 9539 9550 9558 9566 9574 9582 9590 9598 9606 9617 9625 9636 9644 9655 9662"
          fi
          if [ "$YEAR" = "all" ] || [ "$YEAR" = "2025" ]; then
            KEYS="$KEYS 9693 9998 10006 10014 10022 10033 9987 9979 9971 9963 9955 9947 9939 9928 9920 9912 9904 9896 9888 9877 9869 9858 9850 9839"
          fi
          if [ "$YEAR" = "all" ] || [ "$YEAR" = "2026" ]; then
            KEYS="$KEYS 11234 11245 11253 11261 11269 11280 11291 11299 11307 11315 11326 11334 11342 11353 11361 11369 11377 11731 11388 11396 11404 11412 11420 11428 11436"
          fi
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"
          echo "Will pump ($YEAR): $KEYS"

      - name: Wake Render + pump
        env:
          API: ${{ secrets.PITWALL_API_URL }}
          SECRET: ${{ secrets.PUMP_SECRET }}
        run: |
          set +e
          if [ -z "$API" ] || [ -z "$SECRET" ]; then
            echo "Missing secrets PITWALL_API_URL or PUMP_SECRET"
            exit 1
          fi
          API="${API%/}"
          OK=0
          FAIL=0

          # Wake free-tier (có thể cold 30–60s)
          echo "Waking Render…"
          for i in 1 2 3 4 5; do
            if curl -sS -m 60 "$API/health" | grep -q ok; then
              echo "health ok (try $i)"
              break
            fi
            echo "wake try $i…"
            sleep 10
          done
          sleep 8

          for KEY in ${{ steps.keys.outputs.keys }}; do
            echo "======== session_key=$KEY ========"
            # Pump ~1–3 phút/race (drivers + 900–1100 laps INSERT)
            CODE=$(curl -sS -m 240 -o /tmp/pump.json -w "%{http_code}" \
              "$API/api/pump?secret=$SECRET&session_key=$KEY" || echo "000")
            echo "HTTP $CODE"
            head -c 400 /tmp/pump.json 2>/dev/null; echo

            if [ "$CODE" = "200" ]; then
              OK=$((OK+1))
              sleep 3
              continue
            fi

            # 1 retry after re-wake
            echo "retry after wake…"
            curl -sS -m 45 "$API/health" >/dev/null 2>&1 || true
            sleep 20
            CODE=$(curl -sS -m 240 -o /tmp/pump.json -w "%{http_code}" \
              "$API/api/pump?secret=$SECRET&session_key=$KEY" || echo "000")
            echo "retry HTTP $CODE"
            head -c 300 /tmp/pump.json 2>/dev/null; echo

            if [ "$CODE" = "200" ]; then
              OK=$((OK+1))
            else
              FAIL=$((FAIL+1))
              echo "SKIP $KEY"
            fi
            sleep 3
          done

          echo "DONE ok=$OK fail=$FAIL"
          if [ "$OK" -eq 0 ]; then exit 1; fi
          exit 0
