name: Pump OpenF1 to MySQL

on:
  workflow_dispatch:
    inputs:
      year:
        description: "Year (historical one-shot; daily uses 2026 only)"
        required: true
        default: "2026"
        type: choice
        options:
          - "2026"
          - "2025"
          - "2024"
          - "2023"
          - "all"
      force:
        description: "Force re-pump even if data exists"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "0 6 * * *"

jobs:
  pump:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Resolve session keys
        id: keys
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            YEAR="2026"
            FORCE="false"
          else
            YEAR="${{ inputs.year }}"
            FORCE="${{ inputs.force }}"
          fi
          echo "mode=$YEAR force=$FORCE"
          KEYS=""
          if [ "$YEAR" = "all" ] || [ "$YEAR" = "2023" ]; then
            KEYS="$KEYS 7953 7779 7787 9070 9078 9094 9102 9110 9118 9126 9133 9141 9149 9157 9165 9173 9221 9213 9181 9205 9189 9197"
          fi
          if [ "$YEAR" = "all" ] || [ "$YEAR" = "2024" ]; then
            KEYS="$KEYS 9472 9480 9488 9496 9673 9507 9515 9523 9531 9539 9550 9558 9566 9574 9582 9590 9598 9606 9617 9625 9636 9644 9655 9662"
          fi
          if [ "$YEAR" = "all" ] || [ "$YEAR" = "2025" ]; then
            KEYS="$KEYS 9693 9998 10006 10014 10022 10033 9987 9979 9971 9963 9955 9947 9939 9928 9920 9912 9904 9896 9888 9877 9869 9858 9850 9839"
          fi
          if [ "$YEAR" = "all" ] || [ "$YEAR" = "2026" ]; then
            KEYS="$KEYS 11234 11245 11253 11261 11269 11280 11291 11299 11307 11315 11326 11334 11342 11353 11361 11369 11377 11731 11388 11396 11404 11412 11420 11428 11436"
          fi
          echo "keys=$KEYS" >> "$GITHUB_OUTPUT"
          echo "force=$FORCE" >> "$GITHUB_OUTPUT"

      - name: Wake Render and pump
        env:
          API: ${{ secrets.PITWALL_API_URL }}
          SECRET: ${{ secrets.PUMP_SECRET }}
          FORCE: ${{ steps.keys.outputs.force }}
          KEYS: ${{ steps.keys.outputs.keys }}
        run: |
          set +e
          if [ -z "$API" ] || [ -z "$SECRET" ]; then
            echo "Missing secrets PITWALL_API_URL or PUMP_SECRET"
            exit 1
          fi
          API="${API%/}"
          OK=0
          SKIP=0
          FAIL=0
          PYCOUNT='import sys,json
try:
 d=json.load(sys.stdin)
 print(len(d) if isinstance(d,list) else 0)
except Exception:
 print(0)'

          echo "Waking Render..."
          for i in 1 2 3 4 5; do
            if curl -sS -m 60 "$API/health" | grep -q ok; then
              echo "health ok try=$i"
              break
            fi
            sleep 10
          done
          sleep 5

          for KEY in $KEYS; do
            echo "======== session_key=$KEY ========"

            if [ "$FORCE" != "true" ]; then
              LB_N=$(curl -sS -m 45 "$API/api/leaderboard?session_key=$KEY" | python3 -c "$PYCOUNT")
              if [ "${LB_N:-0}" -ge 10 ]; then
                echo "SKIP already in MySQL (leaderboard=$LB_N)"
                SKIP=$((SKIP + 1))
                continue
              fi
            fi

            CODE=$(curl -sS -m 240 -o /tmp/pump.json -w "%{http_code}" "$API/api/pump?secret=$SECRET&session_key=$KEY" || echo "000")
            echo "HTTP $CODE"
            head -c 400 /tmp/pump.json 2>/dev/null || true
            echo

            if [ "$CODE" = "200" ]; then
              OK=$((OK + 1))
              sleep 3
              continue
            fi

            echo "retry after wake..."
            curl -sS -m 45 "$API/health" >/dev/null 2>&1 || true
            sleep 15
            CODE=$(curl -sS -m 240 -o /tmp/pump.json -w "%{http_code}" "$API/api/pump?secret=$SECRET&session_key=$KEY" || echo "000")
            echo "retry HTTP $CODE"
            head -c 300 /tmp/pump.json 2>/dev/null || true
            echo

            if [ "$CODE" = "200" ]; then
              OK=$((OK + 1))
            else
              FAIL=$((FAIL + 1))
              echo "FAIL $KEY"
            fi
            sleep 3
          done

          echo "DONE pumped=$OK skipped=$SKIP failed=$FAIL"
          if [ "$OK" -eq 0 ] && [ "$SKIP" -eq 0 ]; then
            exit 1
          fi
          exit 0
